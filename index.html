<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pipit Publishing</title>

    <style>

        body {
            margin: 20px;
            font-family: sans-serif;

            /* Background image */
            background-image: url("Images/IonaSky.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .logo {
            width: 100px;
            height: auto;
        }

        .header-text {
            line-height: 1.4;
        }

        .title-font {
            font-family: "Times New Roman", serif; /* Georgia */
            font-size: 40px;
            font-weight: weight 600 ;
            font-style: normal;
        }

        .subtitle-font {
            font-family: "Times New Roman", serif;
            font-size: 22px;
            font-weight: 500;
            font-style: italic;
        }

        .bottom-text {
            position: fixed;
            bottom: 20px;       /* Distance from bottom edge */
            left: 100px;         /* Distance from left edge */
            right: 20px;
            text-align: left;   /* center */
        }

        @media (max-width: 600px) {
            body {
                margin: 8px;
            }

            .header-text {
                font-size: 15px;
            }

            .title-font {
                font-size: 20px;
            }
            .subtitle-font {
                font-size: 12px;
            }
            .bottom-text {
                font-size: 9px;
                left: 50px;
            }

            .logo {
                width: 50px;
            }

            .header {
                gap: 10px;
            }

        }


    </style>

</head>

<!--
    \hbox{\style Meadow Pipit}%
    \hbox{\style Christian Publishing}%
    \hbox{\cmfont{#2}\slshape Cross Stone, Yorkshire}%
        <span class="title-font">Meadow Pipit</span><br>
        <span class="subtitle-font">Christian Publishing</span><br>
        <span class="small-bold">Cross Stone, Yorkshire</span>

    Welcome to <span style="font-weight: bold;">Meadow Pipit</span>
        Publishing.
-->

<body>

    <div class="header">
        <img src="Images/PipitLogoCover.png" alt="Logo" class="logo">

        <div class="header-text">
            <span class="title-font">Meadow Pipit</span><br>
            <span class="title-font">Christian Publishing</span><br>
            <span class="subtitle-font">Cross Stone, Yorkshire</span>
        </div>
    </div>


    <div class="bottom-text">
        The Wilderness, Mull, from Iona<br>
        Copyright © 2026 Meadow Pipit Christian Publishing
    </div>

</body>
</html>
